name: Publish

on:
  push:
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    if: github.repository == 'Ganyu-Studios/sweety-html-transcripts'
    permissions:
      # Only npm provenance needs a token here; nothing is pushed back to the repository.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The version in package.json is the release: bump it on `main` and merge into `release`.
      # Publishing is skipped when that version is already on npm, so a merge that carries no bump
      # (or a re-run) is a no-op instead of a failure.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")

          if npm view "sweety-html-transcripts@$version" version > /dev/null 2>&1; then
            echo "sweety-html-transcripts@$version is already published, nothing to do."
            exit 0
          fi

          echo "Publishing sweety-html-transcripts@$version"
          npm config set //registry.npmjs.org/:_authToken ${NODE_AUTH_TOKEN}
          npm publish --provenance
