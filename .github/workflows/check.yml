name: Build, Lint, Format & Publish
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prepare` only sets up husky here, so nothing compiles until `prepack` runs at publish time.
      # Without these two steps a type error reaches npm before anything notices.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  linter:
    # Nothing gets pushed back or published off a red verify run.
    needs: verify
    # Push events only: this job commits back to `github.ref`, which on a pull_request is the ephemeral
    # `refs/pull/N/merge` — not a branch to push to, and gone the moment the pull request is merged.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint and Format
        run: pnpm lint
        id: biome

      - name: Commit and Push changes
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: apply formatting"
            git push origin HEAD:${{ github.ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

      - name: Publish in pkg.pr.new
        run: pnpx pkg-pr-new publish
        if: github.repository == 'Ganyu-Studios/sweety-html-transcripts'
